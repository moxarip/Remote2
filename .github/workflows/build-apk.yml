name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/RemoteBackup-update.apk
          VERSION_NAME=$(grep -E 'versionName\s*=\s*' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0.2")
          echo "DETECTED_VERSION=$VERSION_NAME"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=v${VERSION_NAME}" >> $GITHUB_ENV
          fi

      - name: Upload Debug APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: release-assets/RemoteBackup-update.apk
          retention-days: 14

      - name: Publish GitHub Release with APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Remote Backup ${{ env.RELEASE_TAG }}"
          body: |
            ## 🚀 Remote Backup Update (${{ env.RELEASE_TAG }})
            
            - **Commit:** ${{ github.sha }}
            - **Branch:** ${{ github.ref_name }}
            - **Built automatically by GitHub Actions CI/CD**
            
            ### 📱 التحديث المباشر داخل التطبيق (In-App OTA):
            - عند فتح التطبيق على هاتفك، سيتعرف تلقائياً على هذا التحديث ويعرض خيار "تحميل وتحديث الآن".
            - يمكنك أيضاً تحميل ملف `RemoteBackup-update.apk` مباشرة أدناه وتثبيته على أي جهاز أندرويد.
          files: |
            release-assets/RemoteBackup-update.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
